name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build & test (MoonBit-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `moon test` runs the cmd/mpkl whitebox tests that `read()`
          # apple-pkl fixture files under third_party/apple-pkl, so the
          # submodule must be checked out or those tests abort.
          submodules: recursive

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: moon version --all

      - name: Install MoonBit deps
        run: moon update

      - name: moon check --deny-warn (native)
        run: moon check --deny-warn --target native

      - name: moon check --deny-warn (js)
        run: moon check --deny-warn --target js

      - name: moon check --deny-warn (wasm)
        run: moon check --deny-warn --target wasm

      - name: moon check --deny-warn (wasm-gc)
        run: moon check --deny-warn --target wasm-gc

      - name: moon test --deny-warn (native)
        run: moon test --target native --deny-warn

      - name: moon test --deny-warn (js)
        run: moon test --target js --deny-warn

      - name: Release build (native)
        run: moon build --target native --release

      - name: mpkl smoke (eval + stdlib)
        run: |
          moon run cmd/mpkl --target native -- eval fixtures/cli.pkl
          moon run cmd/mpkl --target native -- stdlib

      # Reflection over stdlib declarations needs the bundled base.pkl.
      # The candidate paths used to be relative to the working directory,
      # so this fixture gold-matched from the repo root and silently
      # produced a hundredth of the output from anywhere else.
      - name: Smoke - reflection does not depend on the working directory
        run: |
          set -eu
          BIN="$PWD/_build/native/release/build/cmd/mpkl/mpkl.exe"
          IN=third_party/apple-pkl/pkl-core/src/test/files/LanguageSnippetTests/input
          GOLD=third_party/apple-pkl/pkl-core/src/test/files/LanguageSnippetTests/output/api/reflectedDeclaration.pcf
          "$BIN" eval "$PWD/$IN/api/reflectedDeclaration.pkl" > /tmp/from-root.pcf
          ( cd /tmp && "$BIN" eval "$GITHUB_WORKSPACE/$IN/api/reflectedDeclaration.pkl" ) > /tmp/from-elsewhere.pcf
          diff -u "$GOLD" /tmp/from-root.pcf > /dev/null \
            || { echo "evaluating from the repo root no longer gold-matches"; exit 1; }
          diff -u /tmp/from-root.pcf /tmp/from-elsewhere.pcf > /dev/null \
            || { echo "reflection output depends on the working directory"; \
                 echo "root: $(wc -c < /tmp/from-root.pcf) bytes, elsewhere: $(wc -c < /tmp/from-elsewhere.pcf) bytes"; exit 1; }
          ( cd /tmp && "$BIN" stdlib | head -1 )

  contracts:
    name: pkspec contracts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          # third_party/apple-pkl submodule is required for
          # `upstream apple pkl fixture smoke` and
          # `upstream apple pkl parser suite`.
          submodules: recursive

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit deps
        run: moon update

      - name: Set up pkfire (`pkf`)
        uses: mizchi/pkfire@v0.14.1

      - name: Set up pkspec
        uses: mizchi/pkspec@v0.4.2
        with:
          pkl-version: "0.32.1"

      - name: pkspec check
        run: pkspec check specs/Spec.pkl specs/Test.pkl

      - name: pkspec contracts
        run: pkspec exec -f specs/Test.pkl
